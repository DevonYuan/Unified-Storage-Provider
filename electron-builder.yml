# OmniDrive — Electron Builder Configuration

appId: com.omnidrive.app
productName: OmniDrive
copyright: Copyright © 2024

directories:
  output: release
  buildResources: build

files:
  - from: frontend/dist
    to: frontend/dist
    filter:
      - "**/*"
  - electron/**/*
  - package.json

extraResources:
  - from: backend/dist/omnidrive-backend.exe
    to: backend/omnidrive-backend.exe
  - from: ".env"
    to: backend/.env

win:
  target:
    - target: portable
      arch: [x64]
  sign: null
  signAndEditExecutable: false

compression: normal

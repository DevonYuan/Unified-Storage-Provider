# OmniDrive — Electron Builder Configuration

appId: com.omnidrive.app
productName: OmniDrive
copyright: Copyright © 2024

directories:
  output: release
  buildResources: build

files:
  - electron/**/*
  - frontend/dist/**/*
  - package.json

extraResources:
  - from: backend/
    to: backend/
    filter:
      - "**/*"
      - "!__pycache__/**"
      - "!*.pyc"

win:
  target:
    - target: portable
      arch: [x64]

compression: normal
